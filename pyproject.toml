[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifier-lab"
version = "0.1.0"
description = "Local-first agnostic verification laboratory: import documents, review claims, run deterministic checks, export independently checkable reports."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5"]
javascript = ["esprima==4.0.1"]
languages = ["tree-sitter==0.25.2", "tree-sitter-typescript==0.23.2", "tree-sitter-cpp==0.23.4"]

[project.scripts]
verifier-lab = "verifier_lab.cli:main"
elucidary = "verifier_lab.elucidary_desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verifier_lab = ["web/*", "riskpacks_data/*.json", "purposes_data/*.json", "third_party/*.txt"]
