[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifier-lab"
version = "0.1.0"
description = "Local-first agnostic verification laboratory: import documents, review claims, run deterministic checks, export independently checkable reports."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5"]

[project.scripts]
verifier-lab = "verifier_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verifier_lab = ["web/*"]
