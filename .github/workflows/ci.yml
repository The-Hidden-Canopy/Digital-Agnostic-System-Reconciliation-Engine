name: Verification and release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux-python312:
    runs-on: ubuntu-24.04
    # Bubblewrap's user/mount/PID namespaces are part of the application test
    # contract. GitHub's default job sandbox blocks nested namespace creation,
    # so run the test host in an explicitly privileged Ubuntu container rather
    # than weakening parser isolation or selecting portable mode in CI.
    container:
      image: ubuntu:24.04
      options: --privileged
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install required parser isolation
        run: |
          apt-get update
          # setup-python provides CPython, but its _sqlite3 extension links
          # against the container image's system SQLite runtime.
          apt-get install --yes bubblewrap libseccomp2 libsqlite3-0
          python -c "import sqlite3; print(sqlite3.sqlite_version)"
      - name: Install pinned Python test/build dependencies
        run: |
          python -m pip install --require-hashes -r tools/release-build-requirements.txt -r tools/release-pdf-requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Unit, contract, adversarial and integration tests
        run: python -m unittest discover -s tests -t .
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/dasre-ui" --no-save --package-lock=false playwright@1.62.1 axe-core@4.11.0
          "$RUNNER_TEMP/dasre-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compare clean builds and test the installed wheel
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/dasre-ui/node_modules/playwright
          AXE_MODULE: ${{ runner.temp }}/dasre-ui/node_modules/axe-core
        run: python tools/check_release.py --output "$RUNNER_TEMP/dasre-release" --browser --accessibility
      - name: Retain build artifacts and evidence (including failed check logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-python312-release-evidence
          path: |
            ${{ runner.temp }}/dasre-release/evidence.json
            ${{ runner.temp }}/dasre-release/accessibility.json
            ${{ runner.temp }}/dasre-release/logs/
            ${{ runner.temp }}/dasre-release/dist-1/
